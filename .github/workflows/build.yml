name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: root
            project: .
          - name: uploaded
            project: Downloads/SeasonalTitles-main/SeasonalTitles-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --no-daemon clean build
        working-directory: ${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        with:
          name: SeasonalTitles-${{ matrix.name }}
          path: ${{ matrix.project }}/build/libs/SeasonalTitles-*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.name }}
          path: ${{ matrix.project }}/build/reports/tests/test
