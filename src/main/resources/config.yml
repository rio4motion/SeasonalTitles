# Used ONLY when creating the database. Reload never changes the active season.
initial-season:
  name: Winter
  year: 2026
# Tier groups and colors: tiers.yml. Custom definitions: titles.yml.
# Effects: animations.yml. Player feedback: messages.yml.
# MiniMessage format. Placeholders are inserted as plain text.
format: '<color><symbol> <season> <year> • <tier></color>'
symbols:
  winter: '❄'
  spring: '✿'
  summer: '☀'
  autumn: '❧'
# Tier suggestion order follows tiers.yml.
# Optional explicit order WITHIN a tier; unlisted titles follow by season/year.
suggestions:
  title-order: []
render:
  # Minimum translation above the passenger anchor. Legacy lower values are clamped
  # to nametag-top + gap. Upright billboard keeps vertical spacing stable with camera pitch.
  offset: 0.9
  # Top of the existing nametag relative to the passenger anchor. Raise for taller custom names.
  nametag-top: 0.5
  gap: 0.4
  scale: 1.0
  distance: 32
  # Safety visibility checks must run every tick. Geometry is attachment based.
  interval-ticks: 1
visibility:
  # Send equipped titles to their owner too, so the F5 camera can render them.
  # The server cannot detect F5; this also sends them in first person.
  # Previews include the owner even if this option is false. Concealment rules still apply.
  show-self: true
  # Custom nametag plugins often hide vanilla labels using scoreboard teams.
  # Treat that as informational by default, NOT as proof that a player is hidden.
  # Opt in only when this server deliberately uses team name rules for stealth.
  # This optional rule applies to other viewers, never the owner's own title.
  respect-team-nametag-visibility: false
  # Invisibility, vanish/canSee, spectator, crouching and nonstanding poses
  # are always respected and cannot be disabled by the setting above.
  # false still uses depth-tested text; true additionally ray traces blocks.
  line-of-sight: true
reconcile:
  seconds: 60
  batch-size: 16
permissions:
  admin: seasonaltitles.admin
# Temporary scoped logging of command roots only (no arguments). Reload to toggle.
# Shows cancellation/rewrites before dispatch; helps identify external command blockers.
diagnostics:
  command-trace: false
